name = "codex-oauth-proxy"
main = "build/worker.mjs"
compatibility_date = "2026-09-07"
account_id = "02c07a2514d9a25f58c78a180bb8c6f3"
workers_dev = true
compatibility_flags = [
    "streams_enable_constructors"
]
kv_namespaces = [
  { binding = "CODEX_AUTH", id = "02622ed96cc6498789e9d342a17891fe" }
]
vpc_networks = [
  { binding = "CODEX_EGRESS", tunnel_id = "ce0561f2-73c2-486f-98ee-1a2f2e72ffa8", remote = true }
]

[vars]
ENV = "production"


[build]
command = "mise run build-worker"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
