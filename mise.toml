[tools]
go = "1.25.7"

[tasks.build]
run = "go build -o ./codex-oauth-proxy ./cmd/codex-oauth-proxy"
description = "Build the codex-oauth-proxy binary"

[tasks.build-worker]
run = [
  "go run github.com/syumai/workers/cmd/workers-assets-gen -mode=go",
  "GOOS=js GOARCH=wasm go build -o ./build/app.wasm ./cmd/codex-oauth-proxy-worker",
]
description = "Build the Cloudflare Worker"

[tasks.test]
run = "go test ./..."
description = "Run Go tests"

[tasks.publish]
run = "cd npm/ && npm publish"
description = "Publish the npm wrapper package in npm/"

[tasks.npm_publish]
run = "mise run publish"
description = "Alias for publish (kept for backwards compatibility)"
